<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&amp;display=swap');
      .logo-hoofd { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; font-weight: 600; fill: #1a3a16; }
      .logo-sub   { font-family: 'Playfair Display', Georgia, serif; font-size: 9px; font-style: italic; fill: #4a7c3f; letter-spacing: 0.12em; }
    </style>
  </defs>
  <!-- Kleine boompjes icoon -->
  <g transform="translate(4, 8)">
    <!-- boom links -->
    <polygon points="10,32 17,14 24,32" fill="#2d5a27" opacity="0.85"/>
    <polygon points="10,26 17,10 24,26" fill="#4a7c3f" opacity="0.9"/>
    <rect x="15.5" y="32" width="3" height="5" fill="#1a3a16" opacity="0.6"/>
    <!-- boom rechts -->
    <polygon points="20,32 28,12 36,32" fill="#1a3a16" opacity="0.8"/>
    <polygon points="20,25 28,8 36,25" fill="#2d5a27" opacity="0.9"/>
    <rect x="26.5" y="32" width="3" height="5" fill="#1a3a16" opacity="0.6"/>
    <!-- kleine boom voor -->
    <polygon points="26,32 31,20 36,32" fill="#4a7c3f" opacity="0.7"/>
  </g>
  <!-- Tekst -->
  <text x="48" y="26" class="logo-hoofd">d'Alde Pastorije</text>
  <text x="50" y="40" class="logo-sub">Bed &amp; Bos · Hoornsterzwaag</text>
</svg>